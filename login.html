<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Welcome Back</h1>
            <p class="text-gray-500 mt-2">Login to your account</p>
        </div>

        <form>
            <!-- Email -->
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">
                    Email
                </label>
                <input
                    type="email"
                    placeholder="Enter your email"
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">
                    Password
                </label>
                <input
                    type="password"
                    placeholder="Enter your password"
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>

            <!-- Remember Me -->
            <div class="flex items-center justify-between mb-6">
                <label class="flex items-center">
                    <input type="checkbox" class="mr-2">
                    <span class="text-gray-600 text-sm">Remember me</span>
                </label>

                <a href="#" class="text-blue-600 text-sm hover:underline">
                    Forgot Password?
                </a>
            </div>

            <!-- Login Button -->
            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition duration-300"
            >
                Login
            </button>

            <!-- Register -->
            <p class="text-center text-gray-600 mt-6">
                Don't have an account?
                <a href="#" class="text-blue-600 font-medium hover:underline">
                    Register
                </a>
            </p>
        </form>

    </div>

</body>
</html>
